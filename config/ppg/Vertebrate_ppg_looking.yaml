behaviors:
  Vertebate:
    trainer_type: ppg
    hyperparameters:
      # Standardowe parametry
      batch_size: 256
      buffer_size: 5120
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 2  # Zmniejszone z 3 dla bezpieczniejszej Fazy 1 w PPG
      learning_rate_schedule: linear
      
      # Parametry ekskluzywne dla PPG
      num_policy_updates_per_aux: 16
      aux_epochs: 6
      kl_penalty_coef: 1.0
      shared_critic: false
      
    network_settings:
      normalize: true
      hidden_units: 512  # Uwaga na VRAM, mamy teraz dwie takie sieci
      num_layers: 3
      vis_encode_type: simple
      
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
        
    keep_checkpoints: 50
    max_steps: 50000000
    time_horizon: 1000
    summary_freq: 30000