behaviors:
  Vertebate:
    trainer_type: td3
    hyperparameters:
      learning_rate_schedule: linear
      batch_size: 1024
      buffer_size: 2000000
      learning_rate: 0.0003
      policy_noise: 0.2
      noise_clip: 0.5
      policy_delay: 2
      buffer_init_steps: 0
      tau: 0.005
      steps_per_update: 50.0
      save_replay_buffer: true
      reward_signal_steps_per_update: 20.0
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
      deterministic: true
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 15000000
    time_horizon: 1000
    summary_freq: 30000